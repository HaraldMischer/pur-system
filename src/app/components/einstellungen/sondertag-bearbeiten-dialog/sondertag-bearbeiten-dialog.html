<!-- pur-system/src/app/components/einstellungen/sondertag-bearbeiten-dialog/sondertag-bearbeiten-dialog.html -->

<h2 mat-dialog-title>{{ dialogTitel }}</h2>
<mat-dialog-content class="pur-dialog__content">
  @if (fehler(); as fehler) {
    <p class="pur-message pur-message--error pur-message--full" role="alert">
      {{ fehler.meldung }}
      @if (fehler.ursache) {
        <br />
        {{ fehler.ursache }}
      }
    </p>
  }
  <form id="sondertag-form" class="pur-form pur-form--grid" [formGroup]="form" (ngSubmit)="save()">
    <!-- Bezeichnung -->
    <mat-form-field appearance="outline" class="pur-form__item pur-form__item--field">
      <mat-label>Bezeichnung</mat-label>
      <input matInput formControlName="bezeichnung" required maxlength="80" />
    </mat-form-field>

    <!-- Datum -->
    <div class="pur-form__row">
      <app-eingabe-datum
        class="pur-form__item pur-form__item--field pur-flex__item--full"
        label="Datum"
        [modus]="datumModus"
        formControlName="monatTag"
        required
      />
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" [mat-dialog-close]="undefined" [disabled]="inProgress()">
    Abbrechen
  </button>
  <button
    matButton="filled"
    type="submit"
    form="sondertag-form"
    [disabled]="form.invalid || !hatAenderungen() || inProgress()"
  >
    Speichern
  </button>
</mat-dialog-actions>
