<!-- pur-system/src/app/components/systemverwaltung/datenstruktur/firma-anlegen-dialog/firma-anlegen-dialog.html -->

<h2 mat-dialog-title>Firma anlegen</h2>

<mat-dialog-content class="pur-dialog__content">
  <form
    id="firma-anlegen-form"
    class="pur-form pur-form--grid"
    [formGroup]="firmaForm"
    (ngSubmit)="onSubmit()"
  >
    <!-- Grunddaten -->
    <div class="pur-form__group">
      <div class="pur-form__row">
        <mat-form-field appearance="outline" class="pur-form__item pur-form__item--field">
          <mat-label>Anzeigename</mat-label>
          <input matInput formControlName="anzeigename" type="text" autocomplete="organization" />
        </mat-form-field>
      </div>

      <div class="pur-form__row">
        <mat-form-field appearance="outline" class="pur-form__item pur-form__item--field">
          <mat-label>Firmenname</mat-label>
          <input matInput formControlName="firmenname" type="text" autocomplete="organization" />
        </mat-form-field>
      </div>
    </div>

    <!-- Adresse -->
    <div class="pur-form__group" formGroupName="adresse">
      <h2 class="pur-form__group-titel">Adresse</h2>

      <div class="pur-form__row">
        <mat-form-field
          appearance="outline"
          class="pur-form__item pur-form__item--field pur-form__item--80"
        >
          <mat-label>Straße</mat-label>
          <input matInput formControlName="strasse" type="text" autocomplete="street-address" />
        </mat-form-field>

        <mat-form-field
          appearance="outline"
          class="pur-form__item pur-form__item--field pur-form__item--20"
        >
          <mat-label>Nr.</mat-label>
          <input matInput formControlName="hausnummer" type="text" autocomplete="off" />
        </mat-form-field>
      </div>

      <div class="pur-form__row">
        <mat-form-field
          appearance="outline"
          class="pur-form__item pur-form__item--field pur-form__item--20"
        >
          <mat-label>PLZ</mat-label>
          <input matInput formControlName="postleitzahl" type="text" autocomplete="postal-code" />
        </mat-form-field>

        <mat-form-field
          appearance="outline"
          class="pur-form__item pur-form__item--field pur-form__item--80"
        >
          <mat-label>Ort</mat-label>
          <input matInput formControlName="ort" type="text" autocomplete="address-level2" />
        </mat-form-field>
      </div>
    </div>

    <!-- Kontaktdaten -->
    <div class="pur-form__group" formGroupName="kontakt">
      <h2 class="pur-form__group-titel">Kontaktdaten</h2>

      <div class="pur-form__row">
        <mat-form-field
          appearance="outline"
          class="pur-form__item pur-form__item--field pur-form__item--50"
        >
          <mat-label>E-Mail-Adresse</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email" />
          @if (firmaForm.controls.kontakt.controls.email.hasError('email')) {
            <mat-error>Bitte eine gültige E-Mail-Adresse eingeben.</mat-error>
          }
        </mat-form-field>

        <mat-form-field
          appearance="outline"
          class="pur-form__item pur-form__item--field pur-form__item--50"
        >
          <mat-label>Telefon</mat-label>
          <input matInput formControlName="telefon" type="tel" autocomplete="tel" />
        </mat-form-field>
      </div>
    </div>

    @if (firmaStore.error(); as error) {
      <p class="pur-form__item pur-form__item--error" role="alert">{{ error }}</p>
    }
  </form>
</mat-dialog-content>

<!-- Dialogaktionen -->
<mat-dialog-actions class="pur-dialog__footer" align="end">
  <button
    matButton
    type="button"
    [mat-dialog-close]="undefined"
    [disabled]="firmaStore.inProgress()"
  >
    Abbrechen
  </button>
  <button
    matButton="filled"
    type="submit"
    form="firma-anlegen-form"
    [disabled]="firmaForm.invalid || firmaStore.inProgress()"
  >
    {{ firmaStore.inProgress() ? 'Firma wird angelegt' : 'Firma anlegen' }}
  </button>
</mat-dialog-actions>
