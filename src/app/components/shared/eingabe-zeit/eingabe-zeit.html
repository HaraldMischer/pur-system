<!-- pur-system/src/app/components/shared/eingabe-zeit/eingabe-zeit.html -->

<mat-form-field
  appearance="outline"
  class="eingabe-zeit-feld"
  [subscriptSizing]="subscriptSizing()"
>
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    type="text"
    inputmode="numeric"
    autocomplete="off"
    maxlength="5"
    placeholder="HH:mm"
    [formControl]="eingabeControl"
    [required]="required()"
    [readonly]="schreibgeschuetzt()"
    (blur)="handleBlur()"
  />
  <mat-icon matIconSuffix>schedule</mat-icon>
</mat-form-field>
