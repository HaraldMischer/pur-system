<!-- pur-system/src/app/components/shared/eingabe-datum/eingabe-datum.html -->

<mat-form-field
  appearance="outline"
  class="eingabe-datum-feld"
  [subscriptSizing]="subscriptSizing()"
>
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    type="text"
    inputmode="numeric"
    autocomplete="off"
    [maxlength]="maxlength()"
    [placeholder]="placeholder()"
    [formControl]="eingabeControl"
    [required]="required()"
    [readonly]="schreibgeschuetzt()"
    (blur)="handleBlur()"
  />
  <mat-icon matIconSuffix>calendar_today</mat-icon>
</mat-form-field>
