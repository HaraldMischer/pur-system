<!-- pur-system/src/app/components/system/benutzer/benutzer-verwaltung/benutzer-loeschen-dialog/benutzer-loeschen-dialog.html -->

<h2 mat-dialog-title>Benutzerkonto löschen</h2>

<mat-dialog-content class="pur-dialog__content">
  <div
    class="pur-form pur-form--grid"
    [attr.aria-busy]="verwaltungStore.inProgress()"
    [attr.inert]="verwaltungStore.inProgress() ? '' : null"
  >
    <p class="pur-message pur-message--info pur-message--full">
      Das Benutzerkonto von <strong>{{ profil.anzeigename }}</strong> und sein Benutzerprofil werden
      endgültig gelöscht. Dieser Vorgang kann nicht rückgängig gemacht werden.
    </p>

    @if (verwaltungStore.updateError(); as error) {
      <p class="pur-message pur-message--error pur-message--full" role="alert">{{ error }}</p>
    }
  </div>
</mat-dialog-content>

<!-- Dialogaktionen -->
<mat-dialog-actions class="pur-dialog__footer" align="end">
  <button
    matButton
    type="button"
    [mat-dialog-close]="undefined"
    [disabled]="verwaltungStore.inProgress()"
  >
    Abbrechen
  </button>
  <button
    matButton="filled"
    type="button"
    [disabled]="verwaltungStore.inProgress()"
    (click)="deleteBenutzer()"
  >
    {{
      verwaltungStore.inProgress()
        ? 'Benutzerkonto wird gelöscht'
        : 'Benutzerkonto endgültig löschen'
    }}
  </button>
</mat-dialog-actions>
