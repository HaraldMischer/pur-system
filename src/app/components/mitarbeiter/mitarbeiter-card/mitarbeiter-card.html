<!-- pur-system/src/app/components/mitarbeiter/mitarbeiter-card/mitarbeiter-card.html -->

<mat-card
  class="pur-card pur-card--mitarbeiter pur-farbkennung"
  appearance="outlined"
  [class.pur-card--inaktiv]="!mitarbeiter().aktiv"
  [style.--pur-farbkennung-farbe]="farbe()"
>
  <mat-card-header>
    <mat-icon class="pur-card__avatar" mat-card-avatar aria-hidden="true">person</mat-icon>
    <mat-card-title class="pur-text pur-text--title-large pur-text--primary pur-text--ellipsis">{{
      name()
    }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="pur-card__content-text">
      <span class="pur-text pur-text--secondary">{{ rollenText() }}</span>
      <span class="pur-text pur-text--secondary">{{ filialenText() }}</span>
    </div>
  </mat-card-content>
  <mat-card-actions align="end">
    @if (darfZusammenfuehren()) {
      <button matButton type="button" (click)="selectZusammenfuehren()">
        <mat-icon aria-hidden="true">merge</mat-icon>
        Zusammenführen
      </button>
    }
    <button matButton type="button" (click)="selectBearbeiten()">
      <mat-icon aria-hidden="true">edit</mat-icon>
      Bearbeiten
    </button>
  </mat-card-actions>
</mat-card>
