<!-- pur-system/src/app/components/schichtplan/dienstplan-arbeitsbereich/dienstplan-arbeitsbereich.html -->

<section class="pur-page _pur-page--limited dienstplan-arbeitsbereich">
  <section class="pur-page-section">
    <header class="pur-page-section__header">
      <h2 class="pur-page-section__title">Monatspläne</h2>
      <div class="pur-page-section__header-actions dienstplan-arbeitsbereich__navigation">
        <button matIconButton type="button" aria-label="Vorheriger Monat" (click)="changeMonat(-1)">
          <mat-icon aria-hidden="true">chevron_left</mat-icon>
        </button>
        <strong>{{ monatsbezeichnung() }}</strong>
        <button matIconButton type="button" aria-label="Nächster Monat" (click)="changeMonat(1)">
          <mat-icon aria-hidden="true">chevron_right</mat-icon>
        </button>
        <button matButton="outlined" type="button" (click)="selectAktuellerMonat()">
          Aktueller Monat
        </button>
      </div>
    </header>

    <div class="dienstplan-arbeitsbereich__arbeitsflaeche">
      <div class="dienstplan-arbeitsbereich__dienstplaene pur-scrollbar">
        @if (filialauswahl().length === 0) {
          <p class="pur-page-section__message" role="status">
            Wähle mindestens eine Filiale, um ihre Dienstpläne anzuzeigen.
          </p>
        } @else {
          <div class="dienstplan-arbeitsbereich__filialabschnitte">
            @for (auswahl of filialauswahl(); track auswahl.filiale.id) {
              <app-dienstplan-filialabschnitt
                [filiale]="auswahl.filiale"
                [pfad]="auswahl.pfad"
                [monat]="selectedMonat()"
                [planungsmodus]="planungsmodus()"
              />
            }
          </div>
        }
      </div>

      <section class="pur-page-section dienstplan-arbeitsbereich__mitarbeiter pur-scrollbar">
        <header class="pur-page-section__header">
          <h3 class="pur-page-section__title">Mitarbeiter</h3>
        </header>
        <div class="pur-page-section__empty-state">
          Die Mitarbeiterübersicht wird in einem nächsten Schritt ergänzt.
        </div>
      </section>
    </div>
  </section>
</section>
