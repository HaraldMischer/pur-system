<!-- pur-system/src/app/pages/einstellungen/oeffnungszeiten-page/oeffnungszeiten-page.html -->

<section class="pur-page pur-page--limited oeffnungszeiten-page">
  <section class="pur-page-section">
    <p class="pur-message pur-message--surface pur-message--full">
      Einmalige Sondertage überschreiben Feiertage und jährlich wiederkehrende Sondertage; diese
      überschreiben die Wochentage.
    </p>
    @if (filialauswahl().length === 0) {
      <p class="pur-message pur-message--surface pur-message--full" role="status">
        Wähle mindestens eine Filiale aus.
      </p>
    } @else {
      <div class="filial-oeffnungszeiten">
        @for (auswahl of filialauswahl(); track auswahl.filiale.id) {
          <app-oeffnungszeiten-filiale [filiale]="auswahl.filiale" [pfad]="auswahl.pfad" />
        }
      </div>
    }
  </section>
</section>
