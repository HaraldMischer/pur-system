<!-- pur-system/src/app/pages/systemverwaltung-page/benutzer-page/benutzer-verwaltung/benutzer-datenzuordnung-dialog/benutzer-datenzuordnung-dialog.html -->

<h2 mat-dialog-title>{{ dialogTitel }}</h2>

<mat-dialog-content class="pur-dialog__content">
  <div
    class="pur-form pur-form--grid"
    [attr.aria-busy]="verwaltungStore.inProgress()"
    [attr.inert]="verwaltungStore.inProgress() ? '' : null"
  >
    <app-benutzer-datenzuordnung
      [profil]="profil"
      [unternehmer]="unternehmer()"
      [inProgress]="verwaltungStore.inProgress()"
      (zuordnungSpeichern)="saveDatenzuordnung($event)"
      (mitarbeiterZuordnungSpeichern)="saveMitarbeiterZuordnung($event)"
    />

    @if (verwaltungStore.updateError(); as error) {
      <p class="pur-form__item pur-form__item--error" role="alert">{{ error }}</p>
    }
  </div>
</mat-dialog-content>

<!-- Dialogaktionen -->
<mat-dialog-actions class="pur-dialog__footer" align="end">
  <button
    matButton
    type="button"
    [mat-dialog-close]="undefined"
    [disabled]="verwaltungStore.inProgress()"
  >
    Abbrechen
  </button>
  <button
    matButton="filled"
    type="button"
    [disabled]="speichernDeaktiviert()"
    (click)="saveZuordnung()"
  >
    {{ verwaltungStore.inProgress() ? 'Zuordnung wird gespeichert' : 'Zuordnung speichern' }}
  </button>
</mat-dialog-actions>
