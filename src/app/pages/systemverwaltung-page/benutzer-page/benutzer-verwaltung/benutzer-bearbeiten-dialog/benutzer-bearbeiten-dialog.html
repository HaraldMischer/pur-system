<!-- pur-system/src/app/pages/systemverwaltung-page/benutzer-page/benutzer-verwaltung/benutzer-bearbeiten-dialog/benutzer-bearbeiten-dialog.html -->

<h2 mat-dialog-title>{{ dialogTitel }}</h2>

<mat-dialog-content class="pur-dialog__content">
  <form
    id="benutzer-bearbeiten-form"
    class="pur-form pur-form--grid"
    [formGroup]="benutzerForm"
    [attr.aria-busy]="verwaltungStore.inProgress()"
    [attr.inert]="verwaltungStore.inProgress() ? '' : null"
    (ngSubmit)="onSubmit()"
  >
    <!-- Profildaten -->
    <div class="pur-form__group">
      <div class="pur-form__row">
        <mat-form-field appearance="outline" class="pur-form__item pur-form__item--field">
          <mat-label>Anzeigename</mat-label>
          <input matInput formControlName="anzeigename" type="text" autocomplete="name" />
        </mat-form-field>
        <mat-checkbox class="pur-form__item pur-form__item--checkbox" formControlName="aktiv">
          Benutzerprofil aktiv
        </mat-checkbox>
      </div>
    </div>

    <!-- Erlaubte Bereiche -->
    <div class="pur-form__group" formGroupName="erlaubteBereiche">
      <h2 class="pur-form__group-titel">Erlaubte Bereiche</h2>
      <div class="pur-form__row">
        @for (bereich of bereiche; track bereich.value) {
          <mat-checkbox
            class="pur-form__item pur-form__item--checkbox"
            [formControlName]="bereich.value"
          >
            {{ bereich.label }}
          </mat-checkbox>
        }
      </div>
    </div>

    @if (verwaltungStore.updateError(); as error) {
      <p class="pur-form__item pur-form__item--error" role="alert">{{ error }}</p>
    }
  </form>
</mat-dialog-content>

<!-- Dialogaktionen -->
<mat-dialog-actions class="pur-dialog__footer" align="end">
  <button
    matButton
    type="button"
    [mat-dialog-close]="undefined"
    [disabled]="verwaltungStore.inProgress()"
  >
    Abbrechen
  </button>
  <button
    matButton="filled"
    type="submit"
    form="benutzer-bearbeiten-form"
    [disabled]="benutzerForm.invalid || !hatAenderungen() || verwaltungStore.inProgress()"
  >
    {{ verwaltungStore.inProgress() ? 'Benutzer wird gespeichert' : 'Änderungen speichern' }}
  </button>
</mat-dialog-actions>
