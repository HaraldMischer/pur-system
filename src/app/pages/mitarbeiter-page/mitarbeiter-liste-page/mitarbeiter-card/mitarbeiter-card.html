<!-- pur-system/src/app/pages/mitarbeiter-page/mitarbeiter-liste-page/mitarbeiter-card/mitarbeiter-card.html -->

<mat-card
  class="pur-card pur-card--mitarbeiter"
  appearance="outlined"
  [class.pur-card--inaktiv]="!mitarbeiter().aktiv"
>
  <mat-card-header>
    <mat-icon mat-card-avatar aria-hidden="true">person</mat-icon>
    <mat-card-title>{{ name() }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{ rollenLabel() }}</p>
    <p>{{ filialenText() }}</p>
  </mat-card-content>
  <mat-card-actions align="end">
    @if (darfZusammenfuehren()) {
      <button matButton type="button" (click)="selectZusammenfuehren()">
        <mat-icon aria-hidden="true">merge</mat-icon>
        Zusammenführen
      </button>
    }
    <button matButton type="button" (click)="selectBearbeiten()">
      <mat-icon aria-hidden="true">edit</mat-icon>
      Bearbeiten
    </button>
  </mat-card-actions>
</mat-card>
