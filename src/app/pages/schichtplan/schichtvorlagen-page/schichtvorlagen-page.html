<!-- pur-system/src/app/pages/schichtplan/schichtvorlagen-page/schichtvorlagen-page.html -->

<section class="pur-page pur-page--limited schichtvorlagen-page">
  <section class="pur-page-section">
    @if (filialauswahl().length === 0) {
      <p class="pur-page-section__message" role="status">Wähle mindestens eine Filiale aus.</p>
    } @else {
      <div class="schichtvorlagen-page__filialabschnitte">
        @for (auswahl of filialauswahl(); track auswahl.filiale.id) {
          <app-schichtvorlagen-filialabschnitt [filiale]="auswahl.filiale" [pfad]="auswahl.pfad" />
        }
      </div>
    }
  </section>
</section>
