<!-- pur-system/src/app/app.html -->

<mat-sidenav-container class="app-shell">
  @if (!routenKontext().authLayout) {
    <mat-sidenav
      class="app-sidenav"
      [mode]="isHandset() ? 'over' : 'side'"
      [opened]="!isHandset()"
      aria-label="Hauptnavigation"
    >
      <!-- app-sidenav -->
      <app-sidenav [isHandset]="isHandset()" (navigationSelected)="closeSidenav()" />
    </mat-sidenav>
  }

  <mat-sidenav-content class="app-content">
    <header class="app-header">
      <!-- app-toolbar -->
      <app-toolbar
        [title]="routenKontext().toolbarTitel"
        [brandVisible]="routenKontext().authLayout"
        [navigationVisible]="!routenKontext().authLayout"
        [sidenavOpened]="isSidenavOpened"
        [isAuthenticated]="benutzerStore.isAuthenticated() && !routenKontext().authLayout"
        [inProgress]="benutzerStore.inProgress()"
        (navigationToggle)="toggleSidenav()"
      />

      <app-global-banner />
    </header>

    <main class="app-main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
